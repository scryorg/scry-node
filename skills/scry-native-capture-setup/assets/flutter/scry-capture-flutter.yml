# Capture the app's screens headless (no emulator) and upload them to Scry, on every push to the default branch.
# Never on a pull request: the upload needs SCRY_API_KEY, and a pull request must not get a secret.
# Setup: repository variable SCRY_PROJECT_ID (proj_xxxxxxxx) and repository secret SCRY_API_KEY (sk_live_xxxxxxxx).
# Without both (a fork, a fresh clone) the capture and the bundle check still run and the upload is skipped with a
# notice: the run stays green.
# The headless capture is a Flutter Material rendering on the runner, not an iOS or Android device look: the bundle
# is platform `other` ("Flutter · Other"). For an emulator or simulator capture see references/flutter.md.
# If the repository's default branch is not `main`, change `main` under `on.push.branches` below: that is the only edit.
# The upload step compares the pushed branch with the repository's default branch itself, so there is no second
# place to keep in step. A push to a branch that is not the default branch uploads nothing and says so in a notice.
name: scry-capture
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Use the Flutter version the app builds with: headless pixels depend on it (the sample pins 3.47.6).
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Capture headless
        run: bash scripts/capture.sh headless
      - name: The bundle is valid
        run: npx @scrymore/scry-deployer@0.11.1 upload .scry/capture --dry-run
      # The key is read by this step only. With no key or no project id the step ends green with a notice and
      # uploads nothing; the values are never printed.
      - name: Upload to Scry
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if [ -z "$SCRY_API_KEY" ] || [ -z "$SCRY_PROJECT_ID" ]; then
            msg="Scry upload skipped. Set the repository secret SCRY_API_KEY and the repository variable SCRY_PROJECT_ID to enable it. The capture and the bundle check above ran."
            echo "::notice title=Scry upload skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx @scrymore/scry-deployer@0.11.1 upload .scry/capture
        env:
          SCRY_PROJECT_ID: ${{ vars.SCRY_PROJECT_ID }}
          SCRY_API_KEY: ${{ secrets.SCRY_API_KEY }}
      # The same trigger on a branch that is not the default branch (the trigger was renamed to another branch): no
      # upload, and the run says so instead of ending green in silence. This step reads no secret.
      - name: Note the skipped upload
        if: github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          msg="Scry upload skipped: $REF_NAME is not the repository default branch ($DEFAULT_BRANCH). Set on.push.branches to the default branch to upload."
          echo "::notice title=Scry upload skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Device path (optional, heavier, not shipped here): an emulator or simulator capture needs a different runner
      # and `bash scripts/capture.sh android|ios` instead of `headless`. See references/flutter.md before adding one.
